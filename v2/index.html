<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6a00" />
  <title>飞猪保险频道 V5</title>
  <style>
    :root {
      --orange: #ff6a00;
      --orange-dark: #c65300;
      --blue: #1677ff;
      --green: #1f9d69;
      --red: #ef4b43;
      --ink: #1f2429;
      --text: #3c4652;
      --muted: #8d98a7;
      --line: #edf0f4;
      --bg: #f5f6f9;
      --card: #ffffff;
      --cream: #fff7ed;
      --shadow: 0 9px 24px rgba(31, 36, 41, .08);
      --travel: url("assets/real/couple-travel.jpg");
      --plane: url("assets/real/travel.jpg");
      --family: url("assets/real/family.jpg");
      --health: url("assets/real/health.jpg");
      --pet: url("assets/real/car-pet.jpg");
      --digital: url("assets/real/digital.jpg");
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #edf1f6; color: var(--ink); }
    button, input { font: inherit; }
    button { border: 0; background: transparent; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    input { border: 0; outline: 0; min-width: 0; background: transparent; color: var(--ink); }

    .stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 22px 0; }
    .phone {
      position: relative;
      width: min(430px, 100vw);
      min-height: min(932px, 100vh);
      overflow: hidden;
      border-radius: 30px;
      background: var(--bg);
      border: 1px solid rgba(255,255,255,.86);
      box-shadow: 0 22px 56px rgba(37, 43, 52, .18);
    }
    .status {
      height: 34px;
      padding: 0 18px 7px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      background: #fff;
      font-size: 12px;
      font-weight: 950;
    }
    .sys { display: flex; align-items: center; gap: 5px; }
    .signal { width: 18px; height: 10px; display: grid; grid-template-columns: repeat(4,1fr); gap: 2px; align-items: end; }
    .signal i { display: block; width: 3px; border-radius: 2px; background: #111; }
    .signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:10px}
    .battery { position: relative; width: 22px; height: 11px; border: 1.8px solid #111; border-radius: 3px; }
    .battery::before { content: ""; position: absolute; inset: 2px 5px 2px 2px; background: #111; border-radius: 1px; }
    .battery::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: #111; border-radius: 0 2px 2px 0; }

    .app { height: calc(min(932px, 100vh) - 34px); overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    .app::-webkit-scrollbar { width: 0; }
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 14px 11px;
      background: rgba(255,255,255,.98);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .top-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 9px; }
    .brand { display: flex; align-items: center; gap: 9px; }
    .logo { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: linear-gradient(135deg, #ff7a1b, #ffb13b); color: #fff; font-size: 17px; font-weight: 950; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.05; letter-spacing: 0; }
    .brand small { display: block; margin-top: 2px; color: #6e7782; font-size: 11px; font-weight: 780; }
    .round-actions { display: flex; gap: 8px; }
    .round { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f4f6f8; color: #29313a; font-size: 12px; font-weight: 950; }
    .search {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 14px;
      background: #f5f7fa;
      border: 1px solid #edf0f4;
      color: #7c8794;
      font-size: 13px;
      font-weight: 780;
    }
    .search b { color: var(--orange); }

    .content { padding: 12px 12px 20px; }
    .section { margin-top: 14px; }
    .head { margin: 0 2px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .head h2 { margin: 0; font-size: 17px; line-height: 1.1; letter-spacing: 0; }
    .head span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .link { color: var(--orange); font-size: 12px; font-weight: 950; white-space: nowrap; }
    .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.9); }

    .account {
      position: relative;
      overflow: hidden;
      padding: 14px;
      background: linear-gradient(135deg, #fff 0%, #fff 62%, #fff1df 100%);
    }
    .account::after {
      content: "";
      position: absolute;
      right: -24px;
      top: -22px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,106,0,.22), transparent 65%);
    }
    .account-main { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 12px; }
    .account h2 { margin: 0; font-size: 19px; letter-spacing: 0; }
    .account p { margin: 5px 0 0; color: #66717e; font-size: 12px; font-weight: 800; }
    .score-ring {
      width: 76px;
      height: 76px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 58%, transparent 60%), conic-gradient(var(--orange) 78%, #e9edf2 0);
      font-weight: 950;
    }
    .score-ring b { display: block; font-size: 22px; text-align: center; }
    .score-ring span { display: block; color: #909aa7; font-size: 9px; font-weight: 900; text-align: center; }
    .account-bars { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 13px; }
    .stat { min-height: 58px; padding: 9px 6px; border-radius: 14px; background: #fff; border: 1px solid #f0f2f5; text-align: center; }
    .stat b { display: block; color: var(--orange); font-size: 18px; }
    .stat span { display: block; color: #7f8996; margin-top: 3px; font-size: 10px; font-weight: 900; }

    .service-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .service { min-height: 72px; display: grid; justify-items: center; align-content: center; gap: 6px; border-radius: 16px; background: #fff; box-shadow: 0 6px 17px rgba(31,36,41,.06); font-size: 11px; font-weight: 930; }
    .service i { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 12px; background: #fff0df; color: var(--orange); font-style: normal; font-size: 14px; }
    .service:nth-child(2) i { background: #eaf3ff; color: var(--blue); }
    .service:nth-child(3) i { background: #eaf8f1; color: var(--green); }
    .service:nth-child(4) i { background: #f1edff; color: #7656e8; }

    .order-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 140px;
      padding: 13px;
      display: grid;
      align-content: end;
      color: #fff;
      background-image: linear-gradient(180deg, rgba(9,14,20,.05), rgba(9,14,20,.78)), var(--photo);
      background-size: cover;
      background-position: center;
      text-align: left;
    }
    .order-card h3 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .order-card p { margin: 5px 0 12px; color: rgba(255,255,255,.86); font-size: 12px; font-weight: 800; }
    .order-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .badge { height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,.92); color: #753000; font-size: 10px; font-weight: 950; }
    .small-cta { height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 950; white-space: nowrap; }

    .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: max-content; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { height: 32px; padding: 0 13px; border-radius: 999px; background: #fff; color: #6e7782; border: 1px solid #edf0f4; font-size: 12px; font-weight: 900; }
    .tab.active { color: #fff; background: #202b37; border-color: #202b37; }

    .product-list { display: grid; gap: 9px; }
    .product {
      padding: 11px;
      display: grid;
      grid-template-columns: 66px 1fr auto;
      gap: 10px;
      align-items: center;
      text-align: left;
    }
    .thumb {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      background-image: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.28)), var(--photo);
      background-size: cover;
      background-position: center;
    }
    .product h3 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .product p { margin: 5px 0 0; color: #697482; font-size: 11px; line-height: 1.35; font-weight: 760; }
    .tag-row { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 999px; background: #f4f6f9; color: #6f7a87; font-size: 10px; font-weight: 850; }
    .tag.gold { background: #fff1df; color: #b24c00; }
    .price { color: var(--orange); font-size: 18px; font-weight: 950; white-space: nowrap; }
    .price small { font-size: 10px; color: #a3acb8; }

    .scene-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
    .scene {
      position: relative;
      min-height: 118px;
      overflow: hidden;
      border-radius: 18px;
      background-image: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.68)), var(--photo);
      background-size: cover;
      background-position: center;
      color: #fff;
      text-align: left;
      padding: 12px;
      display: grid;
      align-content: end;
    }
    .scene strong { font-size: 15px; }
    .scene span { display: inline-flex; margin-top: 6px; width: fit-content; height: 22px; align-items: center; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,.9); color: #202b37; font-size: 10px; font-weight: 950; }

    .gold-model { padding: 13px; }
    .model-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .model-title h3 { margin: 0; font-size: 17px; }
    .model-title p { margin: 5px 0 0; color: #7a8491; font-size: 11px; font-weight: 780; }
    .model-title b { color: var(--orange); font-size: 24px; }
    .model-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; margin-top: 12px; }
    .model { min-height: 52px; display: grid; place-items: center; border-radius: 13px; background: #f7f8fb; color: #5f6a77; text-align: center; font-size: 10px; line-height: 1.2; font-weight: 930; }

    .detail-photo {
      overflow: hidden;
      min-height: 168px;
      padding: 13px;
      color: #fff;
      display: grid;
      align-content: end;
      background-image: linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.72)), var(--photo);
      background-size: cover;
      background-position: center;
      text-align: left;
    }
    .detail-photo h2 { margin: 8px 0 0; font-size: 21px; letter-spacing: 0; }
    .detail-photo p { margin: 5px 0 0; color: rgba(255,255,255,.86); font-size: 12px; font-weight: 780; }
    .detail-photo .badge { width: fit-content; }
    .detail-panel { padding: 12px; }
    .mini-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .mini { min-height: 62px; padding: 8px 6px; border-radius: 14px; background: #f7f8fb; text-align: center; }
    .mini b { display: block; color: #202b37; font-size: 13px; }
    .mini span { display: block; margin-top: 5px; color: #7d8794; font-size: 10px; font-weight: 850; }
    .row-list { display: grid; gap: 8px; }
    .info-row { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 900; }
    .info-row span { color: #66717e; font-size: 12px; font-weight: 780; text-align: right; }

    .family-list, .policy-list, .claim-list { display: grid; gap: 9px; }
    .person, .policy-card {
      padding: 11px;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .avatar { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 15px; color: var(--orange); background: #fff0df; font-weight: 950; }
    .person h3, .policy-card h3 { margin: 0; font-size: 14px; }
    .person p, .policy-card p { margin: 4px 0 0; color: #828c98; font-size: 11px; font-weight: 760; }
    .status-pill { height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 999px; background: #eaf8f1; color: #0d8354; font-size: 10px; font-weight: 950; white-space: nowrap; }
    .status-pill.warn { background: #fff1df; color: #a34600; }
    .status-pill.gray { background: #eef1f5; color: #75808d; }

    .steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .step { min-height: 82px; padding: 10px 6px; border-radius: 16px; background: #fff; border: 1px solid #edf0f4; text-align: center; }
    .step b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; margin: 0 auto 7px; color: #fff; background: var(--orange); }
    .step strong { display: block; font-size: 12px; }
    .step span { display: block; color: #8b95a2; margin-top: 3px; font-size: 10px; font-weight: 820; }

    .compare { overflow: hidden; }
    .compare-row { min-height: 43px; display: grid; grid-template-columns: 80px 1fr 1fr; border-top: 1px solid var(--line); }
    .compare-row:first-child { border-top: 0; }
    .compare-row div { padding: 10px 8px; border-left: 1px solid var(--line); font-size: 11px; line-height: 1.35; }
    .compare-row div:first-child { border-left: 0; background: #fafbfc; color: #6f7a87; font-weight: 900; }
    .compare-row strong { font-size: 12px; }

    .confirm { padding: 13px; }
    .check { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; color: #687382; font-size: 11px; line-height: 1.45; font-weight: 760; }
    .check input { accent-color: var(--orange); margin-top: 2px; }
    .sticky {
      position: sticky;
      bottom: calc(76px + env(safe-area-inset-bottom));
      z-index: 10;
      margin-top: 14px;
      padding: 9px 10px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(31,36,41,.94);
      color: #fff;
      box-shadow: 0 14px 28px rgba(31,36,41,.2);
    }
    .sticky strong { display: block; font-size: 17px; }
    .sticky span { display: block; margin-top: 2px; color: rgba(255,255,255,.7); font-size: 10px; font-weight: 780; }
    .btn { height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0 15px; border-radius: 999px; font-weight: 950; white-space: nowrap; }
    .btn.orange { color: #fff; background: linear-gradient(135deg, var(--orange), #ff9c29); }

    .sheet-wrap { position: absolute; inset: 0; z-index: 45; display: none; place-items: end center; padding: 12px; background: rgba(20,25,31,.36); }
    .sheet-wrap.show { display: grid; }
    .sheet { width: 100%; padding: 14px; border-radius: 24px; background: #fff; box-shadow: 0 -18px 38px rgba(20,25,31,.22); }
    .sheet-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .sheet h2 { margin: 0; font-size: 18px; }
    .sheet p { margin: 5px 0 0; color: #788390; font-size: 12px; font-weight: 780; }
    .close { width: 32px; height: 32px; border-radius: 50%; background: #f3f5f8; font-size: 18px; font-weight: 950; }
    .assist-list { display: grid; gap: 8px; }
    .assist { min-height: 54px; padding: 10px; border-radius: 16px; background: #f7f8fb; text-align: left; font-size: 13px; font-weight: 930; }
    .assist span { display: block; margin-top: 3px; color: #87919e; font-size: 11px; font-weight: 760; }

    .nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      height: calc(72px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 4px;
      padding: 7px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 17px; color: #939daa; font-size: 10px; font-weight: 950; }
    .nav b { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 9px; }
    .nav button.active { color: #1f2429; background: #fff0df; }
    .nav button.active b { color: #fff; background: linear-gradient(135deg, var(--orange), #ffad36); }
    .toast { position: absolute; left: 50%; bottom: 92px; z-index: 60; transform: translateX(-50%) translateY(14px); max-width: 310px; padding: 10px 14px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .18s ease; color: #fff; background: rgba(31,36,41,.94); font-size: 12px; font-weight: 900; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 520px) {
      .stage { padding: 0; }
      .phone { width: 100vw; min-height: 100vh; border-radius: 0; border: 0; box-shadow: none; }
      .app { height: calc(100vh - 34px); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="status"><span>9:41</span><div class="sys"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"></div></div></div>
      <main class="app" id="app">
        <header class="top">
          <div class="top-line">
            <div class="brand"><div class="logo">F</div><div><h1>飞猪保险</h1><small>我的保障 · 金选服务</small></div></div>
            <div class="round-actions"><button class="round" data-assist>选</button><button class="round" data-view="policies">单</button></div>
          </div>
          <button class="search" data-assist><b>帮</b><span>搜保障、保单、理赔材料</span></button>
        </header>
        <div class="content" id="view"></div>
      </main>
      <nav class="nav" id="nav"></nav>
      <div class="sheet-wrap" id="sheet"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const products = [
      { id: "travel", icon: "旅", name: "出行安心金选", fit: "机酒签证用户", price: 39, score: 96, photo: "var(--travel)", tags: ["航变", "医疗", "行李"], cover: "航变/境外医疗/行李延误", wait: "次日生效", service: "理赔预审", compare: "同类 32 款" },
      { id: "medical", icon: "医", name: "百万医疗金选", fit: "成人与父母", price: 99, score: 94, photo: "var(--health)", tags: ["住院", "门急诊", "绿通"], cover: "住院医疗/门急诊/绿色通道", wait: "按条款", service: "就医协助", compare: "同类 48 款" },
      { id: "family", icon: "家", name: "家庭健康金选", fit: "亲子与父母", price: 128, score: 92, photo: "var(--family)", tags: ["门诊", "住院", "意外"], cover: "儿童门诊/老人医疗/家庭意外", wait: "按条款", service: "专家问答", compare: "同类 26 款" },
      { id: "life", icon: "责", name: "家庭责任金选", fit: "房贷与子女教育", price: 88, score: 90, photo: "var(--family)", tags: ["寿险", "责任", "教育"], cover: "家庭责任/房贷/教育储备", wait: "按条款", service: "顾问解读", compare: "同类 21 款" },
      { id: "digital", icon: "数", name: "数码资产金选", fit: "手机相机电脑", price: 66, score: 89, photo: "var(--digital)", tags: ["数码", "家财", "责任"], cover: "设备损坏/盗抢/家财责任", wait: "即时可查", service: "材料清单", compare: "同类 18 款" },
      { id: "carpet", icon: "车", name: "车宠生活金选", fit: "自驾与宠物家庭", price: 72, score: 88, photo: "var(--pet)", tags: ["车险", "宠物", "责任"], cover: "自驾事故/宠物医疗/第三方责任", wait: "按条款", service: "事故预审", compare: "同类 16 款" }
    ];

    const policies = [
      ["旅", "东京亲子游保障", "保障中 · 7月18日出发", "保障中"],
      ["医", "百万医疗保障", "待生效 · 父母版", "待生效"],
      ["家", "家庭基础保障", "父母医疗待补齐", "待补齐"],
      ["数", "数码设备保障", "已失效 · 可重新配置", "已失效"]
    ];

    const members = [
      ["我", "本人", "旅行、意外、医疗已覆盖", "良好"],
      ["父", "父母", "医疗和意外建议补齐", "待补"],
      ["孩", "孩子", "门诊和意外建议补齐", "待补"],
      ["宠", "宠物", "可补宠物医疗和责任", "可补"]
    ];

    const navs = [
      ["home", "首页", "首"],
      ["gold", "金选", "金"],
      ["account", "保障", "账"],
      ["policies", "保单", "单"],
      ["claims", "理赔", "赔"]
    ];

    const state = { view: "home", product: products[0], compare: products[1], agreed: false, toastTimer: null };

    function toast(text) {
      const el = $("#toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
    }

    function setView(view) {
      state.view = view;
      render();
      $("#app").scrollTo({ top: 0, behavior: "smooth" });
    }

    function setProduct(id, view = "detail") {
      state.product = products.find(item => item.id === id) || products[0];
      state.compare = products.find(item => item.id !== state.product.id) || products[1];
      setView(view);
    }

    function accountCard() {
      return `
        <section class="card account">
          <div class="account-main">
            <div>
              <h2>我的保障</h2>
              <p>4 张保单 · 2 个缺口待补</p>
            </div>
            <button class="score-ring" data-view="account"><span>保障分</span><b>78</b></button>
          </div>
          <div class="account-bars">
            <button class="stat" data-view="policies"><b>4</b><span>保单</span></button>
            <button class="stat" data-view="account"><b>2</b><span>缺口</span></button>
            <button class="stat" data-view="claims"><b>1</b><span>理赔权益</span></button>
          </div>
        </section>
      `;
    }

    function productList(list = products) {
      return `<div class="product-list">${list.map(item => `
        <button class="card product" data-product="${item.id}">
          <div class="thumb" style="--photo:${item.photo}"></div>
          <div>
            <h3>${item.name}</h3>
            <p>${item.fit} · ${item.cover}</p>
            <div class="tag-row"><span class="tag gold">金选 ${item.score}</span>${item.tags.slice(0,2).map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
          </div>
          <div class="price">¥${item.price}<small>起</small></div>
        </button>
      `).join("")}</div>`;
    }

    function homeView() {
      return `
        ${accountCard()}
        <section class="section">
          <div class="service-grid">
            <button class="service" data-view="policies"><i>单</i>我的保单</button>
            <button class="service" data-view="claims"><i>赔</i>理赔服务</button>
            <button class="service" data-view="account"><i>家</i>家庭保障</button>
            <button class="service" data-assist><i>问</i>帮我选</button>
          </div>
        </section>
        <section class="section">
          <button class="card order-card" style="--photo:var(--travel)" data-product="travel">
            <h3>出境游待补保障</h3>
            <p>航变、医疗、行李延误建议出发前确认</p>
            <div class="order-row"><span class="badge">飞猪订单识别</span><span class="small-cta">去补齐</span></div>
          </button>
        </section>
        <section class="section">
          <div class="head"><div><h2>飞猪金选</h2><span>按五维模型筛过的产品</span></div><button class="link" data-view="gold">更多</button></div>
          ${productList(products.slice(0, 3))}
        </section>
        <section class="section">
          <div class="head"><div><h2>场景保障</h2><span>先按生活场景进入</span></div></div>
          <div class="scene-grid">
            <button class="scene" style="--photo:var(--travel)" data-product="travel"><strong>出行保障</strong><span>签证 航变 医疗</span></button>
            <button class="scene" style="--photo:var(--family)" data-product="family"><strong>家庭保障</strong><span>父母 儿童 责任</span></button>
            <button class="scene" style="--photo:var(--pet)" data-product="carpet"><strong>车宠生活</strong><span>自驾 宠物 责任</span></button>
            <button class="scene" style="--photo:var(--digital)" data-product="digital"><strong>数码资产</strong><span>手机 相机 电脑</span></button>
          </div>
        </section>
      `;
    }

    function goldView() {
      return `
        <section class="card gold-model">
          <div class="model-title">
            <div><h3>飞猪金选</h3><p>投保、保障、价格、理赔、机构综合筛选</p></div>
            <b>96</b>
          </div>
          <div class="model-grid">
            <div class="model">投保<br>门槛</div><div class="model">保障<br>范围</div><div class="model">性价<br>比</div><div class="model">服务<br>理赔</div><div class="model">机构<br>能力</div>
          </div>
        </section>
        <section class="section">
          <div class="tabs"><button class="tab active">推荐</button><button class="tab">医疗</button><button class="tab">旅行</button><button class="tab">家庭</button><button class="tab">财产</button></div>
        </section>
        <section class="section">${productList(products)}</section>
      `;
    }

    function detailView() {
      const p = state.product;
      return `
        <section class="card detail-photo" style="--photo:${p.photo}">
          <span class="badge">${p.compare}</span>
          <h2>${p.name}</h2>
          <p>${p.fit} · 金选评分 ${p.score}</p>
        </section>
        <section class="section card detail-panel">
          <div class="mini-grid">
            <div class="mini"><b>${p.tags[0]}</b><span>核心保障</span></div>
            <div class="mini"><b>${p.wait}</b><span>生效规则</span></div>
            <div class="mini"><b>${p.service}</b><span>服务支持</span></div>
          </div>
        </section>
        <section class="section card detail-panel">
          <div class="head"><div><h2>保障责任</h2><span>先看关键项</span></div></div>
          <div class="row-list">
            <div class="info-row"><strong>适合人群</strong><span>${p.fit}</span></div>
            <div class="info-row"><strong>保障范围</strong><span>${p.cover}</span></div>
            <div class="info-row"><strong>服务理赔</strong><span>${p.service}</span></div>
            <div class="info-row"><strong>价格参考</strong><span>¥${p.price} 起</span></div>
          </div>
        </section>
        <section class="section">
          <div class="head"><div><h2>热门对比</h2><span>主推 vs 备选</span></div></div>
          ${compareTable(p, state.compare)}
        </section>
        <div class="sticky"><div><strong>¥${p.price}<small> 起</small></strong><span>演示投保，不真实支付</span></div><button class="btn orange" data-view="confirm">确认投保</button></div>
      `;
    }

    function compareTable(a, b) {
      return `
        <div class="card compare">
          <div class="compare-row"><div></div><div><strong>${a.name}</strong></div><div><strong>${b.name}</strong></div></div>
          <div class="compare-row"><div>适合</div><div>${a.fit}</div><div>${b.fit}</div></div>
          <div class="compare-row"><div>保障</div><div>${a.cover}</div><div>${b.cover}</div></div>
          <div class="compare-row"><div>服务</div><div>${a.service}</div><div>${b.service}</div></div>
          <div class="compare-row"><div>价格</div><div>¥${a.price} 起</div><div>¥${b.price} 起</div></div>
        </div>
      `;
    }

    function accountView() {
      return `
        ${accountCard()}
        <section class="section">
          <div class="head"><div><h2>家庭保障账户</h2><span>按成员看缺口</span></div></div>
          <div class="family-list">
            ${members.map(([icon, name, desc, status]) => `<div class="card person"><div class="avatar">${icon}</div><div><h3>${name}</h3><p>${desc}</p></div><span class="status-pill ${status === "待补" || status === "可补" ? "warn" : ""}">${status}</span></div>`).join("")}
          </div>
        </section>
        <section class="section">
          <button class="card order-card" style="--photo:var(--family)" data-product="family">
            <h3>家庭缺口建议</h3>
            <p>父母医疗、孩子门诊、家庭责任可优先补齐</p>
            <div class="order-row"><span class="badge">2 项待补</span><span class="small-cta">看方案</span></div>
          </button>
        </section>
      `;
    }

    function policiesView() {
      return `
        <section class="section" style="margin-top:0;">
          <div class="head"><div><h2>我的保单</h2><span>保障中 / 待生效 / 历史保单</span></div></div>
          <div class="policy-list">
            ${policies.map(([icon, name, desc, status]) => `<div class="card policy-card"><div class="avatar">${icon}</div><div><h3>${name}</h3><p>${desc}</p></div><span class="status-pill ${status === "待补齐" ? "warn" : status === "已失效" ? "gray" : ""}">${status}</span></div>`).join("")}
          </div>
        </section>
      `;
    }

    function claimsView() {
      return `
        <section class="card order-card" style="--photo:var(--health)">
          <h3>理赔预审服务</h3>
          <p>先看材料清单，减少反复补交</p>
          <div class="order-row"><span class="badge">安心赔流程</span><span class="small-cta">开始预审</span></div>
        </section>
        <section class="section">
          <div class="steps"><div class="step"><b>1</b><strong>选保单</strong><span>定位事故</span></div><div class="step"><b>2</b><strong>看材料</strong><span>一次交对</span></div><div class="step"><b>3</b><strong>查进度</strong><span>透明跟踪</span></div></div>
        </section>
        <section class="section">
          <div class="claim-list">
            <div class="card policy-card"><div class="avatar">旅</div><div><h3>东京亲子游保障</h3><p>可预审行李延误/医疗咨询</p></div><button class="link" data-assist>预审</button></div>
            <div class="card policy-card"><div class="avatar">医</div><div><h3>百万医疗保障</h3><p>门急诊材料清单可查看</p></div><button class="link" data-assist>查看</button></div>
          </div>
        </section>
      `;
    }

    function confirmView() {
      const p = state.product;
      return `
        <section class="card detail-photo" style="--photo:${p.photo}">
          <span class="badge">演示确认</span>
          <h2>投保确认</h2>
          <p>${p.name} · 本页不采集真实信息</p>
        </section>
        <section class="section card confirm">
          <div class="row-list">
            <div class="info-row"><strong>方案</strong><span>${p.name}</span></div>
            <div class="info-row"><strong>服务</strong><span>${p.service}</span></div>
            <div class="info-row"><strong>合计</strong><span style="color:var(--orange);font-weight:950;">¥${p.price}</span></div>
          </div>
          <label class="check"><input id="agree" type="checkbox" ${state.agreed ? "checked" : ""}> <span>已阅读保障范围、免责说明和理赔材料要求。本页为演示，不真实投保或支付。</span></label>
        </section>
        <div class="sticky"><div><strong>¥${p.price}</strong><span>不真实支付</span></div><button class="btn orange" data-confirm>完成</button></div>
      `;
    }

    function openAssist() {
      const sheet = $("#sheet");
      sheet.innerHTML = `
        <div class="sheet">
          <div class="sheet-head"><div><h2>帮我选</h2><p>像人工导购一样，先按场景选。</p></div><button class="close" data-close>×</button></div>
          <div class="assist-list">
            <button class="assist" data-product="travel">我有出行订单<span>看航变、医疗、取消和行李</span></button>
            <button class="assist" data-product="medical">我想给父母配医疗<span>看住院、门急诊和绿通</span></button>
            <button class="assist" data-view="claims">我要理赔预审<span>先看材料清单和进度</span></button>
          </div>
        </div>
      `;
      sheet.classList.add("show");
      bind();
      $$("[data-close]", sheet).forEach(btn => btn.addEventListener("click", () => sheet.classList.remove("show")));
      sheet.addEventListener("click", event => { if (event.target === sheet) sheet.classList.remove("show"); }, { once: true });
    }

    function renderNav() {
      $("#nav").innerHTML = navs.map(([id, label, icon]) => `<button class="${state.view === id ? "active" : ""}" data-view="${id}"><b>${icon}</b><span>${label}</span></button>`).join("");
    }

    function render() {
      renderNav();
      const views = { home: homeView, gold: goldView, detail: detailView, account: accountView, policies: policiesView, claims: claimsView, confirm: confirmView };
      $("#view").innerHTML = (views[state.view] || homeView)();
      bind();
    }

    function bind() {
      $$("[data-view]").forEach(btn => btn.addEventListener("click", () => { $("#sheet").classList.remove("show"); setView(btn.dataset.view); }));
      $$("[data-product]").forEach(btn => btn.addEventListener("click", () => { $("#sheet").classList.remove("show"); setProduct(btn.dataset.product); }));
      $$("[data-assist]").forEach(btn => btn.addEventListener("click", openAssist));
      const agree = $("#agree");
      if (agree) agree.addEventListener("change", () => state.agreed = agree.checked);
      $$("[data-confirm]").forEach(btn => btn.addEventListener("click", () => {
        const agreeBox = $("#agree");
        if (!agreeBox || !agreeBox.checked) return toast("请先勾选阅读确认");
        state.agreed = true;
        setView("policies");
        toast("已生成演示保单");
      }));
    }

    render();
  </script>
</body>
</html>
