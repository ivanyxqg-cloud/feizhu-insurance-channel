<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6a00" />
  <title>飞猪保险频道 V4</title>
  <style>
    :root {
      --orange: #ff6a00;
      --orange-2: #ff8a1f;
      --blue: #2478ff;
      --cyan: #e9f5ff;
      --green: #22a36f;
      --red: #ef5b4f;
      --ink: #19140f;
      --soft: #6f655c;
      --muted: #9d9289;
      --line: rgba(31, 22, 13, .08);
      --bg: #f6f7fb;
      --card: #fff;
      --cream: #fff6ea;
      --shadow: 0 12px 28px rgba(40, 32, 24, .08);
      --travel: url("assets/os-travel.jpg");
      --hero: url("assets/os-hero-travel.jpg");
      --family: url("assets/os-family.jpg");
      --pet: url("assets/os-pet.jpg");
      --asset: url("assets/os-asset.jpg");
      --home: url("assets/os-home.jpg");
      --sport: url("assets/os-sport.jpg");
      --car: url("assets/os-car.jpg");
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #edf0f6; }
    body { margin: 0; min-height: 100%; color: var(--ink); background: #edf0f6; }
    button, input { font: inherit; }
    button { border: 0; background: transparent; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    input { min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }

    .stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 22px 0; }
    .phone {
      position: relative;
      width: min(430px, 100vw);
      min-height: min(932px, 100vh);
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,.8);
      background: var(--bg);
      box-shadow: 0 18px 50px rgba(36, 31, 24, .16);
    }
    .status {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 18px 7px;
      background: #fff;
      font-size: 12px;
      font-weight: 950;
    }
    .sys { display: flex; align-items: center; gap: 5px; }
    .signal { width: 18px; height: 10px; display: grid; grid-template-columns: repeat(4,1fr); gap: 2px; align-items: end; }
    .signal i { width: 3px; border-radius: 2px; background: #111; display: block; }
    .signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:10px}
    .battery { width: 22px; height: 11px; border: 1.8px solid #111; border-radius: 3px; position: relative; }
    .battery::before { content:""; position:absolute; inset:2px 5px 2px 2px; background:#111; border-radius:1px; }
    .battery::after { content:""; position:absolute; right:-4px; top:3px; width:2px; height:5px; background:#111; border-radius:0 2px 2px 0; }

    .app { height: calc(min(932px, 100vh) - 34px); overflow-y: auto; padding-bottom: calc(82px + env(safe-area-inset-bottom)); overscroll-behavior: contain; scroll-behavior: smooth; }
    .app::-webkit-scrollbar { width: 0; }

    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 14px 11px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 9px; }
    .brand { display: flex; align-items: center; gap: 9px; }
    .mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--orange), #ffb13b); font-weight: 950; }
    h1 { margin: 0; font-size: 20px; line-height: 1.05; letter-spacing: 0; }
    .brand small { display: block; margin-top: 2px; color: #866b54; font-size: 11px; font-weight: 800; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f7f3ef; font-size: 12px; font-weight: 950; }
    .search {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 15px;
      background: #f7f8fb;
      border: 1px solid #edf0f5;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
    }
    .search b { color: var(--orange); }

    .content { padding: 12px 13px 18px; }
    .section { margin-top: 13px; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin: 0 3px 8px; }
    .head h2 { margin: 0; font-size: 17px; line-height: 1.1; letter-spacing: 0; }
    .head span { color: var(--muted); font-size: 11px; font-weight: 800; }
    .link { color: var(--orange); padding: 0; font-size: 12px; font-weight: 950; }

    .card { background: var(--card); border: 1px solid rgba(255,255,255,.75); border-radius: 20px; box-shadow: var(--shadow); }
    .account {
      padding: 14px;
      background:
        linear-gradient(135deg, #fff 0%, #fff8ef 70%, #ffe9c6 100%);
      border: 1px solid rgba(255,106,0,.08);
    }
    .account-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .account h2 { margin: 0; font-size: 19px; letter-spacing: 0; }
    .account p { margin: 5px 0 0; color: var(--soft); font-size: 12px; font-weight: 760; }
    .score {
      width: 72px; height: 72px; flex: 0 0 auto; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at center, #fff 58%, transparent 60%), conic-gradient(var(--orange) 76%, #f0e3d6 0);
      font-weight: 950;
    }
    .score b { font-size: 22px; }
    .account-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 13px; }
    .stat { min-height: 58px; padding: 9px; border-radius: 15px; background: rgba(255,255,255,.72); border: 1px solid rgba(255,106,0,.07); }
    .stat b { display: block; color: var(--orange); font-size: 17px; }
    .stat span { display: block; color: var(--muted); font-size: 10px; font-weight: 850; margin-top: 3px; }

    .quick-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .quick { min-height: 72px; display: grid; place-items: center; border-radius: 18px; background: #fff; box-shadow: 0 8px 18px rgba(40,32,24,.06); font-size: 11px; font-weight: 900; text-align: center; }
    .quick b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 12px; margin-bottom: 5px; color: #fff; background: linear-gradient(135deg, var(--orange), #ffb13b); font-size: 13px; }
    .quick:nth-child(2) b { background: linear-gradient(135deg, var(--blue), #6eb5ff); }
    .quick:nth-child(3) b { background: linear-gradient(135deg, var(--green), #6ad69e); }
    .quick:nth-child(4) b { background: linear-gradient(135deg, #714df4, #a889ff); }

    .gold-card { padding: 12px; display: grid; grid-template-columns: 58px 1fr auto; gap: 11px; align-items: center; text-align: left; }
    .gold-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; color: #b45100; background: #fff1da; font-weight: 950; font-size: 18px; }
    .gold-card h3 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .gold-card p { margin: 5px 0 0; color: var(--soft); font-size: 11px; line-height: 1.35; font-weight: 760; }
    .price { color: var(--orange); font-size: 18px; font-weight: 950; white-space: nowrap; }
    .tags { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .tags span { height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 99px; background: #f3f6fb; color: #687281; font-size: 10px; font-weight: 850; }
    .tags .orange { background: #fff2df; color: #b24d00; }

    .five-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
    .five { min-height: 56px; display: grid; place-items: center; border-radius: 14px; background: #fff; color: var(--soft); font-size: 10px; font-weight: 900; text-align: center; border: 1px solid #edf0f5; }

    .scene-row { display: grid; grid-auto-flow: column; grid-auto-columns: 155px; gap: 9px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
    .scene-row::-webkit-scrollbar { display: none; }
    .scene { position: relative; min-height: 108px; border-radius: 19px; overflow: hidden; color: #fff; text-align: left; background-image: linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.72)), var(--img); background-size: cover; background-position: center; }
    .scene strong { position: absolute; left: 11px; bottom: 34px; font-size: 15px; }
    .scene span { position: absolute; left: 11px; bottom: 12px; height: 20px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 99px; color: #3a1a00; background: rgba(255,242,191,.94); font-size: 10px; font-weight: 950; }

    .policy-list, .service-list { display: grid; gap: 9px; }
    .policy { padding: 11px; display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; }
    .policy-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 16px; color: var(--orange); background: #fff0d8; font-weight: 950; }
    .policy h3 { margin: 0; font-size: 14px; }
    .policy p { margin: 4px 0 0; color: var(--muted); font-size: 11px; font-weight: 760; }
    .status-pill { height: 24px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 99px; background: #eaf7f1; color: #0b7a50; font-size: 10px; font-weight: 950; white-space: nowrap; }
    .status-pill.warn { background: #fff2df; color: #a64700; }
    .status-pill.gray { background: #f0f2f5; color: #767f8d; }

    .compare { overflow: hidden; }
    .compare-row { min-height: 43px; display: grid; grid-template-columns: 84px 1fr 1fr; border-top: 1px solid var(--line); }
    .compare-row:first-child { border-top: 0; }
    .compare-row div { padding: 10px 8px; border-left: 1px solid var(--line); font-size: 11px; line-height: 1.35; }
    .compare-row div:first-child { border-left: 0; color: var(--soft); font-weight: 900; background: #faf6f1; }
    .compare-row strong { font-size: 12px; }

    .detail-hero { padding: 14px; border-radius: 22px; background: linear-gradient(135deg, #fff, #fff4e5); border: 1px solid rgba(255,106,0,.08); }
    .detail-hero h2 { margin: 0; font-size: 21px; }
    .detail-hero p { margin: 6px 0 0; color: var(--soft); font-size: 12px; font-weight: 760; }

    .confirm { padding: 13px; }
    .form-row { min-height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 900; }
    .form-row span { color: var(--soft); font-weight: 800; text-align: right; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 11px; color: var(--soft); font-size: 11px; line-height: 1.45; font-weight: 760; }
    .check input { margin-top: 2px; accent-color: var(--orange); }

    .steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .step { min-height: 86px; padding: 10px 7px; text-align: center; border-radius: 17px; background: #fff; border: 1px solid var(--line); }
    .step b { width: 34px; height: 34px; display: grid; place-items: center; margin: 0 auto 7px; border-radius: 50%; color: #fff; background: var(--orange); }
    .step strong { display: block; font-size: 12px; }
    .step span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 800; }

    .ai-sheet {
      position: absolute;
      inset: 0;
      z-index: 45;
      display: none;
      place-items: end center;
      padding: 13px;
      background: rgba(22,17,12,.36);
    }
    .ai-sheet.show { display: grid; }
    .sheet { width: 100%; border-radius: 24px; background: #fff; padding: 14px; box-shadow: 0 -18px 42px rgba(22,17,12,.2); }
    .sheet-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .sheet h2 { margin: 0; font-size: 18px; }
    .sheet p { margin: 5px 0 0; color: var(--soft); font-size: 12px; font-weight: 760; }
    .close { width: 32px; height: 32px; border-radius: 50%; background: #f2f4f7; font-weight: 950; }
    .ai-options { display: grid; gap: 8px; }
    .ai-option { min-height: 52px; padding: 10px; border-radius: 16px; background: #f7f8fb; text-align: left; font-size: 13px; font-weight: 900; }
    .ai-option span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 760; }

    .sticky { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 9px 10px; border-radius: 18px; color: #fff; background: rgba(28,20,13,.92); box-shadow: 0 12px 26px rgba(28,20,13,.2); backdrop-filter: blur(16px); }
    .sticky strong { display: block; font-size: 16px; }
    .sticky span { display: block; color: rgba(255,255,255,.68); font-size: 10px; font-weight: 780; }
    .btn { height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; border-radius: 999px; font-weight: 950; white-space: nowrap; }
    .btn.orange { color: #fff; background: linear-gradient(135deg, var(--orange), #ffad36); }

    .nav { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(70px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; padding: 7px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.95); border-top: 1px solid var(--line); backdrop-filter: blur(18px); }
    .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 17px; color: #939aa5; font-size: 10px; font-weight: 950; }
    .nav b { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 9px; }
    .nav button.active { color: #2b1706; background: #fff2df; }
    .nav button.active b { color: #fff; background: linear-gradient(135deg, var(--orange), #ffaf31); }

    .toast { position: absolute; left: 50%; bottom: 90px; z-index: 50; transform: translateX(-50%) translateY(16px); max-width: 320px; padding: 10px 14px; border-radius: 99px; color: #fff; background: rgba(28,19,12,.92); font-size: 12px; font-weight: 900; opacity: 0; pointer-events: none; transition: .18s ease; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 520px) {
      .stage { padding: 0; }
      .phone { width: 100vw; min-height: 100vh; border-radius: 0; border: 0; box-shadow: none; }
      .app { height: calc(100vh - 34px); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="status"><span>9:41</span><div class="sys"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"></div></div></div>

      <main class="app" id="app">
        <header class="top">
          <div class="top-row">
            <div class="brand"><div class="mark">F</div><div><h1>飞猪保险</h1><small>保障账户 · 金选服务</small></div></div>
            <div class="top-actions"><button class="icon-btn" data-ai>选</button><button class="icon-btn" data-view="policies">单</button></div>
          </div>
          <button class="search" data-ai><b>帮</b><span>帮我选 / 条款解读 / 理赔预审</span></button>
        </header>
        <div class="content" id="view"></div>
      </main>

      <nav class="nav" id="nav"></nav>
      <div class="toast" id="toast"></div>
      <div class="ai-sheet" id="aiSheet"></div>
    </div>
  </div>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const products = [
      { id: 'travel', icon: '旅', name: '出行安心金选', fit: '机酒签证用户', price: 39, tags: ['航变', '境外医疗', '行李'], img: 'var(--travel)', range: '航变/医疗/行李', wait: '次日生效', service: '理赔预审', score: '96' },
      { id: 'family', icon: '家', name: '家庭健康金选', fit: '亲子与父母', price: 128, tags: ['门诊', '住院', '意外'], img: 'var(--family)', range: '门诊/住院/意外', wait: '按条款', service: '专家问答', score: '92' },
      { id: 'medical', icon: '医', name: '百万医疗金选', fit: '成人与父母', price: 99, tags: ['住院', '门急诊', '绿通'], img: 'var(--family)', range: '住院/门急诊/绿通', wait: '按条款', service: '就医协助', score: '94' },
      { id: 'life', icon: '责', name: '家庭责任金选', fit: '房贷与子女教育', price: 88, tags: ['寿险', '责任', '教育'], img: 'var(--family)', range: '身故/责任/教育', wait: '按条款', service: '顾问解读', score: '90' },
      { id: 'asset', icon: '数', name: '数码资产金选', fit: '手机相机电脑', price: 66, tags: ['数码', '家财', '责任'], img: 'var(--asset)', range: '设备/家财/责任', wait: '即时可查', service: '材料清单', score: '89' },
      { id: 'carpet', icon: '车', name: '车宠生活金选', fit: '自驾与宠物家庭', price: 72, tags: ['车险', '宠物', '责任'], img: 'var(--pet)', range: '车/宠物/第三方', wait: '按条款', service: '事故预审', score: '88' }
    ];

    const policies = [
      ['旅', '东京亲子游保障', '保障中 · 7月18日出发', '保障中'],
      ['家', '家庭基础保障', '父母医疗待补齐', '待补齐'],
      ['数', '数码设备保障', '已失效 · 可重新配置', '已失效'],
      ['车', '车宠生活保障', '待领取自驾权益券', '待补齐']
    ];

    const state = {
      view: 'home',
      product: products[0],
      compare: products[1],
      agreed: false,
      toastTimer: null
    };

    const navs = [
      ['home', '首页', '首'],
      ['gold', '金选', '金'],
      ['account', '账户', '账'],
      ['policies', '保单', '单'],
      ['claims', '理赔', '赔']
    ];

    function toast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }

    function setView(view) {
      state.view = view;
      render();
      $('#app').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setProduct(id, view = 'detail') {
      state.product = products.find(item => item.id === id) || products[0];
      state.compare = products.find(item => item.id !== state.product.id) || products[1];
      setView(view);
    }

    function renderNav() {
      $('#nav').innerHTML = navs.map(([id, label, icon]) => `
        <button class="${state.view === id ? 'active' : ''}" data-view="${id}">
          <b>${icon}</b><span>${label}</span>
        </button>
      `).join('');
    }

    function accountCard() {
      return `
        <section class="card account">
          <div class="account-top">
            <div><h2>我的保障账户</h2><p>3 张保单 · 4 位家庭成员</p></div>
            <div class="score"><b>76</b></div>
          </div>
          <div class="account-stats">
            <button class="stat" data-view="account"><b>2</b><span>缺口</span></button>
            <button class="stat" data-view="policies"><b>3</b><span>保单</span></button>
            <button class="stat" data-view="claims"><b>1</b><span>权益</span></button>
          </div>
        </section>
      `;
    }

    function goldList(limit = products.length) {
      return `<div class="policy-list">${products.slice(0, limit).map(item => `
        <button class="card gold-card" data-product="${item.id}">
          <div class="gold-icon">${item.icon}</div>
          <div>
            <h3>${item.name}</h3>
            <p>${item.fit}</p>
            <div class="tags"><span class="orange">金选 ${item.score}</span>${item.tags.slice(0,2).map(tag => `<span>${tag}</span>`).join('')}</div>
          </div>
          <div class="price">¥${item.price}</div>
        </button>
      `).join('')}</div>`;
    }

    function homeView() {
      return `
        ${accountCard()}
        <section class="section">
          <div class="quick-grid">
            <button class="quick" data-view="gold"><b>金</b>金选保障</button>
            <button class="quick" data-product="travel"><b>旅</b>旅行保障</button>
            <button class="quick" data-product="family"><b>家</b>家庭保障</button>
            <button class="quick" data-view="claims"><b>赔</b>理赔服务</button>
          </div>
        </section>
        <section class="section">
          <div class="head"><div><h2>飞猪金选</h2><span>五维筛选</span></div><button class="link" data-view="gold">更多</button></div>
          ${goldList(2)}
        </section>
        <section class="section">
          <div class="head"><div><h2>出行订单保障</h2><span>飞猪场景优先</span></div></div>
          <div class="scene-row">
            <button class="scene" style="--img:var(--hero)" data-product="travel"><strong>东京亲子游</strong><span>航变 医疗 行李</span></button>
            <button class="scene" style="--img:var(--sport)" data-product="travel"><strong>滑雪出行</strong><span>运动加护</span></button>
            <button class="scene" style="--img:var(--asset)" data-product="asset"><strong>数码随行</strong><span>相机电脑</span></button>
          </div>
        </section>
      `;
    }

    function goldView() {
      return `
        <section class="section" style="margin-top:0;">
          <div class="head"><div><h2>飞猪金选</h2><span>不只看低价</span></div></div>
          <div class="five-grid"><div class="five">投保<br>门槛</div><div class="five">保障<br>范围</div><div class="five">性价<br>比</div><div class="five">服务<br>理赔</div><div class="five">机构<br>能力</div></div>
        </section>
        <section class="section">${goldList()}</section>
      `;
    }

    function detailView() {
      const p = state.product;
      return `
        <section class="detail-hero">
          <div class="tags"><span class="orange">飞猪金选 ${p.score}</span><span>${p.service}</span></div>
          <h2 style="margin-top:10px;">${p.name}</h2>
          <p>${p.fit} · ${p.range}</p>
        </section>
        <section class="section">${goldList(1)}</section>
        <section class="section">
          <div class="head"><div><h2>保障重点</h2><span>先看关键项</span></div></div>
          <div class="five-grid">${p.tags.map(tag => `<div class="five">${tag}</div>`).join('')}<div class="five">${p.wait}</div><div class="five">${p.service}</div></div>
        </section>
        <section class="section">
          <div class="head"><div><h2>产品对比</h2><span>主推 vs 备选</span></div></div>
          ${compareTable(p, state.compare)}
        </section>
        <div class="sticky"><div><strong>¥${p.price}</strong><span>演示价格</span></div><button class="btn orange" data-view="confirm">确认演示</button></div>
      `;
    }

    function compareTable(a, b) {
      return `
        <div class="card compare">
          <div class="compare-row"><div></div><div><strong>${a.name}</strong></div><div><strong>${b.name}</strong></div></div>
          <div class="compare-row"><div>适合</div><div>${a.fit}</div><div>${b.fit}</div></div>
          <div class="compare-row"><div>保障</div><div>${a.range}</div><div>${b.range}</div></div>
          <div class="compare-row"><div>生效</div><div>${a.wait}</div><div>${b.wait}</div></div>
          <div class="compare-row"><div>服务</div><div>${a.service}</div><div>${b.service}</div></div>
        </div>
      `;
    }

    function accountView() {
      return `
        ${accountCard()}
        <section class="section">
          <div class="head"><div><h2>家庭成员</h2><span>缺口视图</span></div></div>
          <div class="policy-list">
            <div class="card policy"><div class="policy-icon">我</div><div><h3>本人</h3><p>旅行、意外已覆盖</p></div><span class="status-pill">良好</span></div>
            <div class="card policy"><div class="policy-icon">父</div><div><h3>父母</h3><p>医疗保障待补齐</p></div><span class="status-pill warn">待补</span></div>
            <div class="card policy"><div class="policy-icon">孩</div><div><h3>孩子</h3><p>门诊和意外建议补齐</p></div><span class="status-pill warn">待补</span></div>
          </div>
        </section>
      `;
    }

    function policiesView() {
      return `
        <section class="section" style="margin-top:0;">
          <div class="head"><div><h2>我的保单</h2><span>保障中 / 待生效 / 已失效</span></div></div>
          <div class="policy-list">
            ${policies.map(([icon, name, desc, status]) => `<div class="card policy"><div class="policy-icon">${icon}</div><div><h3>${name}</h3><p>${desc}</p></div><span class="status-pill ${status === '待补齐' ? 'warn' : status === '已失效' ? 'gray' : ''}">${status}</span></div>`).join('')}
          </div>
        </section>
      `;
    }

    function claimsView() {
      return `
        <section class="section" style="margin-top:0;">
          <div class="head"><div><h2>理赔服务</h2><span>先预审材料</span></div><button class="link" data-ai>预审</button></div>
          <div class="steps"><div class="step"><b>1</b><strong>选保单</strong><span>定位事故</span></div><div class="step"><b>2</b><strong>看材料</strong><span>一次交对</span></div><div class="step"><b>3</b><strong>查进度</strong><span>透明跟踪</span></div></div>
        </section>
        <section class="section">
          <div class="policy-list">
            <div class="card policy"><div class="policy-icon">旅</div><div><h3>东京亲子游保障</h3><p>可发起行李延误/医疗咨询</p></div><button class="link" data-ai>预审</button></div>
            <div class="card policy"><div class="policy-icon">家</div><div><h3>家庭健康保障</h3><p>门诊材料清单可查看</p></div><button class="link" data-ai>查看</button></div>
          </div>
        </section>
      `;
    }

    function confirmView() {
      const p = state.product;
      return `
        <section class="detail-hero"><h2>投保确认</h2><p>${p.name} · 本页为演示确认</p></section>
        <section class="section">
          <div class="card confirm">
            <div class="form-row"><strong>方案</strong><span>${p.name}</span></div>
            <div class="form-row"><strong>服务</strong><span>${p.service}</span></div>
            <div class="form-row"><strong>合计</strong><span style="color:var(--orange);font-weight:950;">¥${p.price}</span></div>
            <label class="check"><input id="agree" type="checkbox" ${state.agreed ? 'checked' : ''}> <span>已阅读保障范围、免责说明和理赔材料要求。本页不采集真实信息。</span></label>
          </div>
        </section>
        <div class="sticky"><div><strong>¥${p.price}</strong><span>不真实支付</span></div><button class="btn orange" data-confirm>完成</button></div>
      `;
    }

    function render() {
      renderNav();
      const views = { home: homeView, gold: goldView, detail: detailView, account: accountView, policies: policiesView, claims: claimsView, confirm: confirmView };
      $('#view').innerHTML = (views[state.view] || homeView)();
      bind();
    }

    function openAI() {
      const sheet = $('#aiSheet');
      sheet.innerHTML = `
        <div class="sheet">
          <div class="sheet-head"><div><h2>帮我选</h2><p>轻量助手，只做选品和解读。</p></div><button class="close" data-close>×</button></div>
          <div class="ai-options">
            <button class="ai-option" data-product="travel">我有出行订单<span>看航变、医疗、取消和行李</span></button>
            <button class="ai-option" data-product="family">我想给家人配保障<span>看父母、孩子、家庭责任</span></button>
            <button class="ai-option" data-view="claims">我要理赔预审<span>先看材料清单和进度</span></button>
          </div>
        </div>`;
      sheet.classList.add('show');
      bind();
      $$('[data-close]', sheet).forEach(btn => btn.addEventListener('click', () => sheet.classList.remove('show')));
      sheet.addEventListener('click', event => { if (event.target === sheet) sheet.classList.remove('show'); }, { once: true });
    }

    function bind() {
      $$('[data-view]').forEach(btn => btn.addEventListener('click', () => { $('#aiSheet').classList.remove('show'); setView(btn.dataset.view); }));
      $$('[data-product]').forEach(btn => btn.addEventListener('click', () => { $('#aiSheet').classList.remove('show'); setProduct(btn.dataset.product); }));
      $$('[data-ai]').forEach(btn => btn.addEventListener('click', openAI));
      const agree = $('#agree');
      if (agree) agree.addEventListener('change', () => state.agreed = agree.checked);
      $$('[data-confirm]').forEach(btn => btn.addEventListener('click', () => {
        const agreeBox = $('#agree');
        if (!agreeBox || !agreeBox.checked) return toast('请先勾选阅读确认');
        state.agreed = true;
        setView('policies');
        toast('已生成演示保单');
      }));
    }

    render();
  </script>
</body>
</html>
