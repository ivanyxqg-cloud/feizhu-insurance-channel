<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6a00" />
  <title>飞猪保险频道 V2</title>
  <style>
    :root {
      --orange: #ff6a00;
      --orange-2: #ff8f1f;
      --gold: #ffe5a6;
      --ink: #17120d;
      --soft: #76695f;
      --muted: #9a8d82;
      --line: rgba(31, 22, 14, .08);
      --bg: #f8f3ea;
      --card: #fffdf8;
      --green: #21a572;
      --blue: #3577f6;
      --red: #e94f45;
      --shadow: 0 14px 34px rgba(88, 48, 13, .13);
      --img-hero: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1100&q=82");
      --img-travel: url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=900&q=82");
      --img-family: url("https://images.unsplash.com/photo-1609220136736-443140cffec6?auto=format&fit=crop&w=900&q=82");
      --img-carpet: url("https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=900&q=82");
      --img-asset: url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=82");
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: #efe6da; }
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 229, 166, .65), transparent 30%),
        radial-gradient(circle at 86% 6%, rgba(255, 106, 0, .18), transparent 24%),
        linear-gradient(135deg, #fff8ed 0%, #f0e5d8 100%);
    }

    button, input { font: inherit; }
    button {
      border: 0;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    input { border: 0; outline: 0; color: var(--ink); background: transparent; min-width: 0; }

    .stage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 22px 0;
    }

    .phone {
      width: min(430px, 100vw);
      min-height: min(932px, 100vh);
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: var(--bg);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.75);
    }

    .status {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 18px 7px;
      font-size: 12px;
      font-weight: 900;
      background: rgba(255, 249, 238, .86);
    }

    .sys { display: flex; align-items: center; gap: 5px; }
    .signal { width: 18px; height: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-items: end; }
    .signal i { display: block; width: 3px; background: #111; border-radius: 2px; }
    .signal i:nth-child(1) { height: 3px; }
    .signal i:nth-child(2) { height: 5px; }
    .signal i:nth-child(3) { height: 7px; }
    .signal i:nth-child(4) { height: 10px; }
    .battery { width: 22px; height: 11px; border: 1.8px solid #111; border-radius: 3px; position: relative; }
    .battery::before { content: ""; position: absolute; inset: 2px 5px 2px 2px; border-radius: 1px; background: #111; }
    .battery::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; border-radius: 0 2px 2px 0; background: #111; }

    .app {
      height: calc(min(932px, 100vh) - 34px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: calc(82px + env(safe-area-inset-bottom));
      scroll-behavior: smooth;
    }
    .app::-webkit-scrollbar { width: 0; }

    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 14px 10px;
      background: rgba(255, 249, 238, .92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.66);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--orange), #ffb13a);
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(255,106,0,.26);
    }
    h1 { margin: 0; font-size: 19px; line-height: 1.05; letter-spacing: 0; }
    .brand small { display: block; margin-top: 2px; color: #8c6b48; font-size: 11px; font-weight: 750; }

    .round {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 18px rgba(47, 31, 18, .08);
      font-weight: 950;
    }

    .search {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(255,106,0,.16);
      color: var(--muted);
      font-size: 13px;
      font-weight: 720;
    }
    .search b { color: var(--orange); font-size: 15px; }
    .search input::placeholder { color: #aa9e93; }

    .content { padding: 10px 13px 18px; }
    .hero {
      position: relative;
      min-height: 176px;
      overflow: hidden;
      border-radius: 26px;
      padding: 16px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(25,17,10,.08) 0%, rgba(25,17,10,.18) 44%, rgba(25,17,10,.78) 100%),
        var(--img-hero) center/cover;
      box-shadow: 0 16px 38px rgba(83, 45, 13, .2);
    }
    .hero-content {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 2;
    }
    .assistant-bot {
      position: absolute;
      right: 15px;
      top: 15px;
      width: 92px;
      height: 92px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255,255,255,.34);
      backdrop-filter: blur(16px);
      display: grid;
      place-items: center;
      box-shadow: 0 14px 26px rgba(30,20,12,.16);
      z-index: 1;
    }
    .assistant-bot::before {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 28%, #fff, #ffe0a2 44%, var(--orange) 100%);
      animation: breathe 2.8s ease-in-out infinite;
      box-shadow: 0 0 0 8px rgba(255,232,180,.18);
    }
    .assistant-face {
      position: relative;
      z-index: 2;
      width: 42px;
      height: 34px;
      border-radius: 15px;
      background: rgba(255,255,255,.82);
      box-shadow: inset 0 -3px 0 rgba(255,106,0,.12);
    }
    .assistant-face::before,
    .assistant-face::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5d2b04;
    }
    .assistant-face::before { left: 11px; }
    .assistant-face::after { right: 11px; }
    .pulse-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff4be;
      box-shadow: 0 0 0 5px rgba(255,244,190,.16);
      animation: floatDot 3.4s ease-in-out infinite;
    }
    .pulse-dot.one { left: 11px; top: 18px; }
    .pulse-dot.two { right: 11px; bottom: 17px; animation-delay: .8s; }
    @keyframes breathe {
      0%, 100% { transform: scale(.96); filter: saturate(1); }
      50% { transform: scale(1.04); filter: saturate(1.15); }
    }
    @keyframes floatDot {
      0%, 100% { transform: translateY(0); opacity: .72; }
      50% { transform: translateY(-7px); opacity: 1; }
    }
    .pill {
      height: 24px;
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 9px;
      border-radius: 99px;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      backdrop-filter: blur(12px);
    }
    .hero h2 { margin: 8px 0 10px; font-size: 25px; line-height: 1.08; letter-spacing: 0; max-width: 250px; }
    .hero-actions { display: flex; gap: 8px; }

    .btn {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 15px;
      border-radius: 999px;
      font-weight: 950;
      white-space: nowrap;
      transition: transform .16s ease, opacity .16s ease;
    }
    .btn:active, .scenario:active, .mini:active, .choice:active, .nav button:active { transform: scale(.98); }
    .btn.primary { color: #321700; background: linear-gradient(135deg, #fff3bf, #fff); }
    .btn.orange { color: #fff; background: linear-gradient(135deg, var(--orange), #ffa52e); box-shadow: 0 9px 18px rgba(255,106,0,.24); }
    .btn.ghost { color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); }
    .btn.light { color: var(--ink); background: #fff6e8; border: 1px solid rgba(255,106,0,.12); }

    .section { margin-top: 12px; }
    .head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin: 0 3px 7px;
    }
    .head h2 { margin: 0; font-size: 17px; line-height: 1.1; letter-spacing: 0; }
    .head span { color: var(--muted); font-size: 11px; font-weight: 760; }
    .link { padding: 0; color: var(--orange); background: transparent; font-size: 12px; font-weight: 950; }

    .scenes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .scenario {
      min-height: 96px;
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 12px;
      color: #fff;
      text-align: left;
      background:
        linear-gradient(180deg, rgba(0,0,0,.02) 0%, rgba(0,0,0,.25) 48%, rgba(0,0,0,.72) 100%),
        var(--scene) center/cover;
      box-shadow: 0 12px 24px rgba(61, 38, 16, .12);
    }
    .scenario strong {
      position: absolute;
      left: 12px;
      bottom: 31px;
      font-size: 16px;
      letter-spacing: 0;
    }
    .scenario span {
      position: absolute;
      left: 12px;
      bottom: 13px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 99px;
      color: #3a1a02;
      background: rgba(255,243,191,.92);
      font-size: 10px;
      font-weight: 950;
    }

    .card {
      border-radius: 22px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 10px 24px rgba(73, 48, 25, .08);
    }

    .recommend {
      display: grid;
      grid-template-columns: 86px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 11px;
    }
    .thumb {
      width: 86px;
      height: 76px;
      border-radius: 18px;
      background: var(--thumb) center/cover;
    }
    .recommend h3, .plan h3, .product h3 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .tagline { margin: 6px 0 0; color: var(--soft); font-size: 12px; font-weight: 760; }
    .price { color: var(--orange); font-size: 18px; font-weight: 950; white-space: nowrap; }

    .guide-hero {
      min-height: 190px;
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.68)),
        var(--guide-img) center/cover;
      padding: 15px;
    }
    .guide-hero h2 { position: absolute; left: 15px; bottom: 44px; margin: 0; font-size: 25px; letter-spacing: 0; }
    .progress {
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 20px;
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.3);
    }
    .progress i { display: block; height: 100%; width: var(--p); border-radius: inherit; background: #fff1b7; }

    .choices { display: grid; gap: 10px; }
    .choice {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      text-align: left;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(73,48,25,.06);
    }
    .choice span { color: var(--muted); font-size: 12px; font-weight: 800; }
    .choice b {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      background: #fff3df;
      color: var(--orange);
    }

    .gap-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .gap {
      padding: 11px 8px;
      text-align: center;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .ring {
      width: 48px;
      height: 48px;
      margin: 0 auto 7px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 58%, transparent 60%),
        conic-gradient(var(--c) var(--v), #efe5da 0);
      color: var(--ink);
      font-size: 12px;
      font-weight: 950;
    }
    .gap strong { display: block; font-size: 12px; }
    .gap span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 850; }

    .plan {
      padding: 12px;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 11px;
      align-items: center;
      background: #fff;
    }
    .plan-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #fff2d5, #ffe1a6);
      color: #b95400;
      font-weight: 950;
      font-size: 18px;
    }
    .plan.main {
      grid-template-columns: 1fr;
      padding: 0;
      overflow: hidden;
    }
    .plan-photo {
      min-height: 150px;
      padding: 13px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.68)),
        var(--plan-img) center/cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .plan-photo h3 { font-size: 21px; }
    .plan-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      gap: 10px;
    }
    .cover-dots { display: flex; gap: 7px; }
    .dot {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: #fff5e8;
      color: #86430b;
      font-size: 12px;
      font-weight: 950;
    }

    details {
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    summary {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 950;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    .reason {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 12px 12px;
    }
    .reason span {
      min-height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #684628;
      background: #fff5e7;
      font-size: 11px;
      font-weight: 900;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .product {
      min-height: 118px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      background: #fff;
    }
    .product small { color: var(--muted); font-size: 11px; font-weight: 800; }

    .detail-top {
      min-height: 260px;
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      padding: 14px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.68)),
        var(--detail-img) center/cover;
    }
    .detail-top .back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      color: #24160a;
      font-weight: 950;
    }
    .detail-copy { position: absolute; left: 14px; right: 14px; bottom: 14px; }
    .detail-copy h2 { margin: 8px 0 8px; font-size: 27px; letter-spacing: 0; }

    .mini-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mini {
      min-height: 72px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }
    .mini b { display: block; color: var(--orange); font-size: 18px; }

    .confirm {
      padding: 13px;
      background: #fff;
    }
    .row {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 900;
    }
    .row span { color: var(--soft); font-weight: 800; }
    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 760;
    }
    .check input { margin-top: 2px; accent-color: var(--orange); }

    .timeline { display: grid; gap: 10px; }
    .time-card {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      background: #fff;
    }
    .time-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #fff0d7;
      color: var(--orange);
      font-weight: 950;
    }
    .time-card strong { display: block; font-size: 14px; }
    .time-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 800; }

    .nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(70px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 7px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
      z-index: 30;
    }
    .nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border-radius: 17px;
      background: transparent;
      color: #95897d;
      font-size: 10px;
      font-weight: 950;
    }
    .nav b {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 9px;
    }
    .nav button.active { color: #321700; background: #fff1df; }
    .nav button.active b { color: #fff; background: linear-gradient(135deg, var(--orange), #ffaf31); }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 90px;
      z-index: 50;
      transform: translateX(-50%) translateY(16px);
      max-width: 320px;
      padding: 10px 14px;
      border-radius: 99px;
      color: #fff;
      background: rgba(28, 19, 12, .92);
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sticky-cta {
      position: sticky;
      bottom: calc(76px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding: 9px 10px;
      border-radius: 19px;
      color: #fff;
      background: rgba(29, 20, 12, .92);
      box-shadow: 0 12px 28px rgba(29,20,12,.22);
      backdrop-filter: blur(16px);
      z-index: 10;
    }
    .sticky-cta strong { display: block; font-size: 16px; }
    .sticky-cta span { color: rgba(255,255,255,.68); font-size: 10px; font-weight: 760; }

    @media (max-width: 520px) {
      .stage { padding: 0; }
      .phone { width: 100vw; min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
      .app { height: calc(100vh - 34px); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="status">
        <span>9:41</span>
        <div class="sys"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"></div></div>
      </div>

      <main class="app" id="app">
        <header class="top">
          <div class="brand-row">
            <div class="brand">
              <div class="mark">F</div>
              <div><h1>飞猪保险</h1><small>一句话配保障</small></div>
            </div>
            <button class="round" data-view="service">单</button>
          </div>
          <label class="search">
            <b>问</b>
            <input id="intentInput" placeholder="我想给这次旅行配保障" />
          </label>
        </header>
        <div class="content" id="view"></div>
      </main>

      <nav class="nav" id="nav"></nav>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const scenes = {
      travel: {
        title: '出行保障',
        short: '航变 医疗 行李',
        img: 'var(--img-travel)',
        icon: '旅',
        hero: '出发前配好',
        questions: [
          { title: '去哪儿', options: [['domestic','国内'], ['asia','亚洲'], ['global','欧美澳']] },
          { title: '和谁去', options: [['solo','自己'], ['family','亲子'], ['parents','父母']] },
          { title: '怎么玩', options: [['city','城市'], ['sport','滑雪潜水'], ['drive','自驾']] }
        ],
        main: { name: '出行安心包', price: 39, cover: ['航变', '医疗', '行李'], fit: '本次出行', gaps: [['医疗', 76], ['取消', 58], ['行李', 68]] },
        alts: ['运动加护', '数码随行']
      },
      family: {
        title: '家庭健康',
        short: '老人 儿童 门诊',
        img: 'var(--img-family)',
        icon: '家',
        hero: '一家人少操心',
        questions: [
          { title: '保障谁', options: [['child','孩子'], ['parents','父母'], ['all','全家']] },
          { title: '最担心', options: [['clinic','门诊'], ['hospital','住院'], ['accident','意外']] },
          { title: '预算', options: [['light','轻量'], ['balanced','均衡'], ['plus','加强']] }
        ],
        main: { name: '家庭基础包', price: 128, cover: ['门诊', '意外', '住院'], fit: '亲子家庭', gaps: [['医疗', 70], ['意外', 64], ['责任', 45]] },
        alts: ['老人关怀', '儿童门诊']
      },
      carpet: {
        title: '车宠生活',
        short: '自驾 宠物 责任',
        img: 'var(--img-carpet)',
        icon: '宠',
        hero: '路上也安心',
        questions: [
          { title: '生活方式', options: [['car','有车'], ['pet','有宠'], ['both','车宠都有']] },
          { title: '常见场景', options: [['drive','自驾'], ['boarding','寄养'], ['city','城市通勤']] },
          { title: '优先补', options: [['rescue','救援'], ['medical','医疗'], ['liability','责任']] }
        ],
        main: { name: '车宠生活包', price: 88, cover: ['救援', '宠医', '责任'], fit: '有车有宠', gaps: [['救援', 62], ['宠医', 72], ['责任', 54]] },
        alts: ['宠物医疗', '自驾责任']
      },
      asset: {
        title: '数码资产',
        short: '手机 相机 房屋',
        img: 'var(--img-asset)',
        icon: '数',
        hero: '贵重物有底',
        questions: [
          { title: '要守护', options: [['phone','手机'], ['camera','相机电脑'], ['home','房屋']] },
          { title: '使用场景', options: [['trip','旅行'], ['daily','日常'], ['empty','房屋空置']] },
          { title: '担心什么', options: [['break','损坏'], ['steal','丢失'], ['water','水电风险']] }
        ],
        main: { name: '资产随行包', price: 66, cover: ['数码', '家财', '责任'], fit: '高值装备', gaps: [['设备', 74], ['家财', 52], ['责任', 48]] },
        alts: ['数码轻保', '家财守护']
      }
    };

    const categories = [
      ['旅行', '航变医疗', '¥19'], ['健康', '家人门诊', '¥69'], ['意外', '通勤运动', '¥12'], ['寿险', '家庭责任', '¥45'],
      ['家财', '房屋贵重物', '¥18'], ['车险', '自驾救援', '¥399'], ['宠物', '宠医寄养', '¥29'], ['运动', '滑雪潜水', '¥15'],
      ['数码', '手机相机', '¥9'], ['责任', '第三方', '¥16']
    ];

    const navs = [
      ['home', '首页', '首'], ['guide', '导购', '问'], ['shelf', '保障', '保'], ['service', '服务', '单'], ['mine', '我的', '我']
    ];

    const state = {
      view: 'home',
      intent: 'travel',
      step: 0,
      answers: [],
      chosenPlan: null,
      agreed: false,
      toastTimer: null
    };

    function scene() { return scenes[state.intent] || scenes.travel; }
    function showToast(text) {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }
    function setView(view) {
      state.view = view;
      render();
      $('#app').scrollTo({ top: 0, behavior: 'smooth' });
    }
    function startGuide(intent) {
      state.intent = intent;
      state.step = 0;
      state.answers = [];
      state.chosenPlan = null;
      setView('guide');
    }
    function answer(value) {
      state.answers[state.step] = value;
      if (state.step < scene().questions.length - 1) {
        state.step += 1;
        render();
      } else {
        state.chosenPlan = scene().main;
        setView('result');
      }
    }

    function renderNav() {
      $('#nav').innerHTML = navs.map(([id, label, icon]) => `
        <button class="${state.view === id || (id === 'guide' && ['guide','result','detail','confirm'].includes(state.view)) ? 'active' : ''}" data-nav="${id}">
          <b>${icon}</b><span>${label}</span>
        </button>
      `).join('');
    }

    function homeView() {
      return `
        <section class="hero">
          <div class="assistant-bot" aria-hidden="true">
            <i class="pulse-dot one"></i>
            <div class="assistant-face"></div>
            <i class="pulse-dot two"></i>
          </div>
          <div class="hero-content">
            <span class="pill">飞猪 AI 投保助手</span>
            <h2>先问清，再推荐</h2>
            <div class="hero-actions">
              <button class="btn primary" data-start="travel">找助手</button>
              <button class="btn ghost" data-view="shelf">全部保障</button>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="head"><div><h2>选一个场景</h2><span>先选诉求，再给方案</span></div></div>
          <div class="scenes">
            ${Object.entries(scenes).map(([id, item]) => `
              <button class="scenario" style="--scene:${item.img}" data-start="${id}">
                <strong>${item.title}</strong><span>${item.short}</span>
              </button>
            `).join('')}
          </div>
        </section>

        <section class="section">
          <div class="head"><div><h2>今日推荐</h2><span>本次出行优先</span></div></div>
          <button class="card recommend" data-start="travel" style="width:100%;text-align:left;">
            <div class="thumb" style="--thumb:var(--img-travel)"></div>
            <div><h3>出行安心包</h3><p class="tagline">航变 医疗 行李</p></div>
            <div class="price">¥39</div>
          </button>
        </section>
      `;
    }

    function guideView() {
      const item = scene();
      const q = item.questions[state.step];
      const pct = ((state.step + 1) / item.questions.length) * 100;
      return `
        <section class="guide-hero" style="--guide-img:${item.img}">
          <span class="pill">第 ${state.step + 1} 步</span>
          <h2>${q.title}</h2>
          <div class="progress" style="--p:${pct}%"><i></i></div>
        </section>
        <section class="section">
          <div class="choices">
            ${q.options.map(([value, label]) => `
              <button class="choice" data-answer="${value}">
                <span>${label}</span><b>›</b>
              </button>
            `).join('')}
          </div>
        </section>
      `;
    }

    function resultView() {
      const item = scene();
      const plan = state.chosenPlan || item.main;
      return `
        <section class="plan main card">
          <div class="plan-photo" style="--plan-img:${item.img}">
            <span class="pill">已匹配</span>
            <h3>${plan.name}</h3>
          </div>
          <div class="plan-bottom">
            <div class="cover-dots">${plan.cover.map(x => `<span class="dot">${x}</span>`).join('')}</div>
            <div class="price">¥${plan.price}</div>
          </div>
        </section>

        <section class="section">
          <div class="head"><div><h2>缺口一眼看</h2><span>颜色越满越优先</span></div></div>
          <div class="gap-grid">
            ${plan.gaps.map(([name, val], idx) => `
              <div class="gap"><div class="ring" style="--v:${val}%;--c:${idx === 0 ? 'var(--orange)' : idx === 1 ? 'var(--blue)' : 'var(--green)'}">${val}</div><strong>${name}</strong><span>待补齐</span></div>
            `).join('')}
          </div>
        </section>

        <section class="section">
          <div class="head"><div><h2>备选方案</h2><span>少看一点，快决定</span></div></div>
          <div class="choices">
            ${item.alts.map((name, idx) => `
              <button class="plan card" data-alt="${name}">
                <div class="plan-icon">${idx + 1}</div>
                <div><h3>${name}</h3><p class="tagline">${idx ? '更省钱' : '保障更强'}</p></div>
                <div class="price">¥${idx ? plan.price - 18 : plan.price + 26}</div>
              </button>
            `).join('')}
          </div>
        </section>

        <section class="section">
          <details>
            <summary>为什么推荐 <span>⌄</span></summary>
            <div class="reason"><span>${plan.fit}</span><span>${plan.cover[0]}优先</span><span>可用权益</span></div>
          </details>
        </section>

        <div class="sticky-cta">
          <div><strong>¥${plan.price}</strong><span>演示价格</span></div>
          <button class="btn orange" data-view="detail">看详情</button>
        </div>
      `;
    }

    function detailView() {
      const item = scene();
      const plan = state.chosenPlan || item.main;
      return `
        <section class="detail-top" style="--detail-img:${item.img}">
          <button class="back" data-view="result">‹</button>
          <div class="detail-copy">
            <span class="pill">${plan.fit}</span>
            <h2>${plan.name}</h2>
            <div class="hero-actions"><span class="pill">¥${plan.price} 起</span><span class="pill">理赔预审</span></div>
          </div>
        </section>
        <section class="section">
          <div class="mini-row">
            ${plan.cover.map((x, idx) => `<button class="mini"><span><b>${idx + 1}</b>${x}</span></button>`).join('')}
          </div>
        </section>
        <section class="section">
          <details open>
            <summary>保障重点 <span>⌄</span></summary>
            <div class="reason"><span>保障范围</span><span>免责提示</span><span>服务权益</span></div>
          </details>
        </section>
        <div class="sticky-cta">
          <div><strong>¥${plan.price}</strong><span>不真实支付</span></div>
          <button class="btn orange" data-view="confirm">确认演示</button>
        </div>
      `;
    }

    function confirmView() {
      const plan = state.chosenPlan || scene().main;
      return `
        <section class="section">
          <div class="head"><div><h2>确认信息</h2><span>演示链路</span></div></div>
          <div class="card confirm">
            <label class="check" style="margin-top:0;margin-bottom:6px;"><input id="agree" type="checkbox" ${state.agreed ? 'checked' : ''}> <span>已阅读保障范围和免责说明。本页不采集真实信息。</span></label>
            <div class="row"><strong>方案</strong><span>${plan.name}</span></div>
            <div class="row"><strong>对象</strong><span>本人/家庭</span></div>
            <div class="row"><strong>权益</strong><span>理赔预审</span></div>
            <div class="row"><strong>合计</strong><span style="color:var(--orange);font-weight:950;">¥${plan.price}</span></div>
          </div>
        </section>
        <div class="sticky-cta">
          <div><strong>¥${plan.price}</strong><span>演示确认</span></div>
          <button class="btn orange" data-confirm>完成</button>
        </div>
      `;
    }

    function shelfView() {
      return `
        <section class="section" style="margin-top:0;">
          <div class="head"><div><h2>全部保障</h2><span>需要时再展开</span></div></div>
          <div class="product-grid">
            ${categories.map(([name, fit, price], idx) => `
              <button class="product card" data-category="${name}">
                <div><h3>${name}</h3><small>${fit}</small></div>
                <div class="price">${price}</div>
              </button>
            `).join('')}
          </div>
        </section>
      `;
    }

    function serviceView() {
      return `
        <section class="section" style="margin-top:0;">
          <div class="head"><div><h2>保单服务</h2><span>少打扰，关键提醒</span></div></div>
          <div class="timeline">
            <div class="time-card card"><div class="time-icon">旅</div><div><strong>东京亲子游</strong><span>7月18日 · 已保障</span></div><button class="link" data-start="travel">续配</button></div>
            <div class="time-card card"><div class="time-icon">家</div><div><strong>家庭健康</strong><span>2项待补齐</span></div><button class="link" data-start="family">补齐</button></div>
            <div class="time-card card"><div class="time-icon">赔</div><div><strong>理赔预审</strong><span>3步看材料</span></div><button class="link" data-claim>开始</button></div>
          </div>
        </section>
        <section class="section">
          <div class="gap-grid">
            <div class="gap"><div class="ring" style="--v:33%;--c:var(--orange)">1</div><strong>选事故</strong><span>第一步</span></div>
            <div class="gap"><div class="ring" style="--v:66%;--c:var(--blue)">2</div><strong>看材料</strong><span>第二步</span></div>
            <div class="gap"><div class="ring" style="--v:100%;--c:var(--green)">3</div><strong>查进度</strong><span>第三步</span></div>
          </div>
        </section>
      `;
    }

    function mineView() {
      return `
        <section class="hero" style="min-height:190px;background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.7)), var(--img-family) center/cover;">
          <div class="hero-content">
            <span class="pill">家庭账户</span>
            <h2>保障分 76</h2>
            <div class="hero-actions"><button class="btn primary" data-start="family">继续补齐</button></div>
          </div>
        </section>
        <section class="section">
          <div class="mini-row">
            <button class="mini"><span><b>3</b>成员</span></button>
            <button class="mini"><span><b>2</b>缺口</span></button>
            <button class="mini"><span><b>1</b>权益</span></button>
          </div>
        </section>
      `;
    }

    function render() {
      renderNav();
      const views = { home: homeView, guide: guideView, result: resultView, detail: detailView, confirm: confirmView, shelf: shelfView, service: serviceView, mine: mineView };
      $('#view').innerHTML = (views[state.view] || homeView)();
      bind();
    }

    function bind() {
      $$('[data-nav]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.nav)));
      $$('[data-view]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
      $$('[data-start]').forEach(btn => btn.addEventListener('click', () => startGuide(btn.dataset.start)));
      $$('[data-answer]').forEach(btn => btn.addEventListener('click', () => answer(btn.dataset.answer)));
      $$('[data-alt]').forEach(btn => btn.addEventListener('click', () => {
        const base = scene().main;
        state.chosenPlan = { ...base, name: btn.dataset.alt, price: btn.dataset.alt.includes('轻') ? base.price - 18 : base.price + 26 };
        render();
        showToast('已切换方案');
      }));
      $$('[data-category]').forEach(btn => btn.addEventListener('click', () => {
        const name = btn.dataset.category;
        const map = { 旅行: 'travel', 健康: 'family', 意外: 'family', 寿险: 'family', 家财: 'asset', 车险: 'carpet', 宠物: 'carpet', 运动: 'travel', 数码: 'asset', 责任: 'carpet' };
        startGuide(map[name] || 'travel');
      }));
      const input = $('#intentInput');
      input.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        const text = input.value;
        if (/家|孩|父|母|健康/.test(text)) startGuide('family');
        else if (/车|宠|狗|猫/.test(text)) startGuide('carpet');
        else if (/数码|手机|相机|电脑|房/.test(text)) startGuide('asset');
        else startGuide('travel');
      });
      const agree = $('#agree');
      if (agree) agree.addEventListener('change', () => state.agreed = agree.checked);
      $$('[data-confirm]').forEach(btn => btn.addEventListener('click', () => {
        const agreeBox = $('#agree');
        if (!agreeBox || !agreeBox.checked) return showToast('请先勾选阅读确认');
        state.agreed = true;
        setView('service');
        showToast('已生成演示保单');
      }));
      $$('[data-claim]').forEach(btn => btn.addEventListener('click', () => showToast('理赔预审已开启')));
    }

    render();
  </script>
</body>
</html>
